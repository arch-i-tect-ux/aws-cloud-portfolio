name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy-lambdas:
    name: Deploy Lambda functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Zip and deploy contact_form Lambda
        run: |
          cd lambda/contact_form
          zip -r function.zip lambda_function.py
          aws lambda update-function-code \
            --function-name portfolio-contact-form \
            --zip-file fileb://function.zip
          echo "✓ contact_form deployed"

      - name: Zip and deploy get_submissions Lambda
        run: |
          cd lambda/get_submissions
          zip -r function.zip lambda_function.py
          aws lambda update-function-code \
            --function-name portfolio-get-submissions \
            --zip-file fileb://function.zip
          echo "✓ get_submissions deployed"

  notify:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: deploy-lambdas
    steps:
      - run: echo "All Lambda functions deployed successfully on $(date)"
